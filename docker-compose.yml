# Local development stack — mirrors the Heroku production topology.
#   docker compose up -d
#   psql "postgresql://freebies:freebies@localhost:5432/freebies" -f schema.sql
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: freebies
      POSTGRES_PASSWORD: freebies
      POSTGRES_DB: freebies
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freebies"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata: